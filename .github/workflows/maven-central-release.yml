# Reusable Maven Central Release Workflow
#
# Usage:
#   jobs:
#     release:
#       uses: markpollack/build-tools/.github/workflows/maven-central-release.yml@main
#       with:
#         version: '0.1.0'
#         java-version: '21'
#         agent-clis: 'claude,gemini'   # optional
#       secrets:
#         MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
#         MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
#         GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
#         GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

name: Maven Central Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.0)'
        required: true
        type: string
      java-version:
        description: 'Java version to use'
        required: false
        type: string
        default: '21'
      java-distribution:
        description: 'Java distribution to use'
        required: false
        type: string
        default: 'temurin'
      skip-tests:
        description: 'Skip running tests'
        required: false
        type: boolean
        default: false
      create-tag:
        description: 'Create and push Git tag'
        required: false
        type: boolean
        default: true
      tag-prefix:
        description: 'Tag prefix (e.g., v for v0.1.0)'
        required: false
        type: string
        default: 'v'
      agent-clis:
        description: 'Comma-separated agent CLIs to install (claude,gemini,codex,amazon-q)'
        required: false
        type: string
        default: ''
      release-notes-file:
        description: 'Repository-relative Markdown file to use as the GitHub release body'
        required: false
        type: string
        default: ''
      release-assets:
        description: 'Newline-delimited repository-relative file paths or globs to attach to the GitHub release'
        required: false
        type: string
        default: ''
    secrets:
      MAVEN_USERNAME:
        description: 'Maven Central username'
        required: true
      MAVEN_PASSWORD:
        description: 'Maven Central password/token'
        required: true
      GPG_SECRET_KEY:
        description: 'GPG private key for signing'
        required: true
      GPG_PASSPHRASE:
        description: 'GPG passphrase'
        required: true
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key for integration tests'
        required: false
      GEMINI_API_KEY:
        description: 'Google API key for integration tests'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + all tags so the "Build release notes" step can find the
          # previous tag (PREV_TAG) and resolve the git log PREV_TAG..TAG range.
          # Without this the shallow checkout has no prior tags -> notes fall back to
          # the "Initial release." placeholder on every release.
          fetch-depth: 0

      - name: Setup agent CLIs
        if: ${{ inputs.agent-clis != '' }}
        uses: markpollack/build-tools/.github/actions/setup-agent-clis@main
        with:
          clis: ${{ inputs.agent-clis }}

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set version
        run: ./mvnw versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false

      - name: Verify no SNAPSHOT dependencies
        run: |
          if grep -r "SNAPSHOT" --include="pom.xml" . | grep -v "<!--" | grep -v "target/" | grep -v "src/main/resources/"; then
            echo "ERROR: Found SNAPSHOT references in POM files"
            exit 1
          fi
          echo "No SNAPSHOT dependencies found"

      - name: Build and verify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.skip-tests }}" = "true" ]; then
            ./mvnw clean verify -B -DskipTests
          else
            ./mvnw clean verify -B
          fi

      - name: Publish release to Maven Central
        run: ./mvnw deploy -B -DskipTests -Prelease
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Commit release version
        if: ${{ inputs.create-tag }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Release ${{ inputs.version }}"

      - name: Create Git tag
        if: ${{ inputs.create-tag }}
        run: |
          git tag -a ${{ inputs.tag-prefix }}${{ inputs.version }} -m "Release ${{ inputs.tag-prefix }}${{ inputs.version }}"
          git push origin ${{ inputs.tag-prefix }}${{ inputs.version }}

      - name: Build release notes
        if: ${{ inputs.create-tag }}
        id: release-notes
        env:
          RELEASE_NOTES_FILE: ${{ inputs.release-notes-file }}
          RELEASE_ASSETS: ${{ inputs.release-assets }}
          RELEASE_NOTES_OUTPUT: /tmp/release-notes.md
        run: |
          python3 - <<'PY'
          import glob
          import os
          from pathlib import Path, PurePosixPath
          import re
          import shutil

          LITERAL_PATH = re.compile(r"[A-Za-z0-9._/@+ -]+")
          GLOB_PATH = re.compile(r"[A-Za-z0-9._/@+*? -]+")
          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()

          def fail(message):
              raise SystemExit(f"ERROR: {message}")

          def validate(value, label, allow_glob):
              if not value:
                  fail(f"{label} must not be empty")
              if len(value) > 256:
                  fail(f"{label} exceeds the 256-character limit")
              if value != value.strip():
                  fail(f"{label} must not have leading or trailing whitespace")
              if "\\" in value:
                  fail(f"{label} must use repository-relative POSIX separators")
              allowed = GLOB_PATH if allow_glob else LITERAL_PATH
              if allowed.fullmatch(value) is None:
                  fail(f"{label} contains unsupported characters")
              path = PurePosixPath(value)
              if path.is_absolute():
                  fail(f"{label} must be relative to the repository")
              if value.endswith("/") or "//" in value:
                  fail(f"{label} must name a file or file glob")
              if any(part in ("", ".", "..") for part in value.split("/")):
                  fail(f"{label} must not contain '.' or '..' path segments")
              if not allow_glob and any(character in value for character in "*?"):
                  fail(f"{label} must name one file, not a glob")
              if allow_glob:
                  if sum(value.count(character) for character in "*?") > 8:
                      fail(f"{label} contains too many glob metacharacters")
                  recursive = [part for part in path.parts if "**" in part]
                  if len(recursive) > 1 or any(part != "**" for part in recursive):
                      fail(f"{label} may contain at most one complete '**' segment")
              return path

          def resolve_inside_workspace(candidate, label):
              try:
                  resolved = candidate.resolve(strict=True)
                  resolved.relative_to(root)
              except (FileNotFoundError, RuntimeError, ValueError):
                  fail(f"{label} must resolve to a file inside the repository")
              return resolved

          notes = os.environ.get("RELEASE_NOTES_FILE", "")
          if notes:
              path = validate(notes, "release-notes-file", False)
              source = resolve_inside_workspace(
                  root / Path(*path.parts), "release-notes-file"
              )
              if not source.is_file():
                  fail("release-notes-file must resolve to a regular file")
              shutil.copyfile(source, os.environ["RELEASE_NOTES_OUTPUT"])
              print(f"Using curated release notes from {path}")

          assets = os.environ.get("RELEASE_ASSETS", "")
          if assets:
              patterns = [line for line in assets.splitlines() if line]
              if not patterns:
                  fail("release-assets must contain at least one non-empty path or glob")
              if len(patterns) > 32:
                  fail("release-assets accepts at most 32 paths or globs")
              for index, pattern in enumerate(patterns, start=1):
                  path = validate(pattern, f"release-assets line {index}", True)
                  matches = []
                  for match in glob.iglob(
                      str(root / Path(*path.parts)), recursive=True, include_hidden=True
                  ):
                      resolved = resolve_inside_workspace(
                          Path(match), f"release-assets line {index}"
                      )
                      if resolved.is_file():
                          matches.append(resolved)
                  if not matches:
                      fail(
                          f"release-assets line {index} did not match a repository file: {pattern}"
                      )
                  for match in sorted(set(matches)):
                      print(match.relative_to(root).as_posix())
          PY

          if [ -n "$RELEASE_NOTES_FILE" ]; then
            exit 0
          fi

          TAG="${{ inputs.tag-prefix }}${{ inputs.version }}"
          # Find the previous tag (most recent tag before this one)
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            # Commit list since the previous tag. pom.xml changes are INCLUDED — a BOM or
            # dependency release IS its pom edits — and only the automated release/bump
            # commits are filtered out (so a dependency-only release still gets real notes).
            NOTES=$(git log --pretty=format:'- %s' --no-merges "${PREV_TAG}..${TAG}" \
                    | grep -viE '^- (Release [0-9]|Bump (to |development version))')
            if [ -z "$NOTES" ]; then
              NOTES="Version bump only — no functional changes since ${PREV_TAG}."
            else
              NOTES=$(printf "## Changes since %s\n\n%s" "$PREV_TAG" "$NOTES")
            fi
          else
            NOTES="Initial release."
          fi
          # Write to file to preserve newlines
          echo "$NOTES" > "$RELEASE_NOTES_OUTPUT"

      - name: Create GitHub Release
        if: ${{ inputs.create-tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag-prefix }}${{ inputs.version }}
          name: Release ${{ inputs.version }}
          draft: false
          prerelease: ${{ contains(inputs.version, '-') }}
          body_path: /tmp/release-notes.md
          files: ${{ inputs.release-assets }}
          fail_on_unmatched_files: true

      - name: Bump to next SNAPSHOT version
        if: ${{ inputs.create-tag }}
        run: |
          # Parse version and increment minor: 0.6.0 -> 0.7.0-SNAPSHOT
          IFS='.' read -r major minor patch <<< "${{ inputs.version }}"
          NEXT_VERSION="${major}.$((minor + 1)).0-SNAPSHOT"
          echo "Bumping to next development version: ${NEXT_VERSION}"
          ./mvnw versions:set -DnewVersion=${NEXT_VERSION} -DgenerateBackupPoms=false
          git add -A
          git commit -m "Bump development version to ${NEXT_VERSION}"
          git push origin HEAD:main
