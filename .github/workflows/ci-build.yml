# Reusable CI Build Workflow
#
# Usage:
#   jobs:
#     build:
#       uses: markpollack/build-tools/.github/workflows/ci-build.yml@main
#       with:
#         java-version: '21'
#         agent-clis: 'claude,gemini'   # optional
#       secrets:
#         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

name: CI Build

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use'
        required: false
        type: string
        default: '21'
      java-distribution:
        description: 'Java distribution to use'
        required: false
        type: string
        default: 'temurin'
      maven-goals:
        description: 'Maven goals to run'
        required: false
        type: string
        default: 'clean verify -B'
      skip-tests:
        description: 'Skip running tests'
        required: false
        type: boolean
        default: false
      upload-test-results:
        description: 'Upload test results as artifact'
        required: false
        type: boolean
        default: true
      agent-clis:
        description: 'Comma-separated agent CLIs to install (claude,gemini,codex,amazon-q)'
        required: false
        type: string
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key for integration tests'
        required: false
      GEMINI_API_KEY:
        description: 'Google API key for integration tests'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup agent CLIs
        if: ${{ inputs.agent-clis != '' }}
        uses: markpollack/build-tools/.github/actions/setup-agent-clis@main
        with:
          clis: ${{ inputs.agent-clis }}

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: maven

      - name: Build with Maven
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.skip-tests }}" = "true" ]; then
            ./mvnw ${{ inputs.maven-goals }} -DskipTests
          else
            ./mvnw ${{ inputs.maven-goals }}
          fi

      - name: Upload test results
        if: ${{ inputs.upload-test-results && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7
